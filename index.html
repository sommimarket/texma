/* ============================================================
   NOTIFICACIONES LOCALES
   · Se muestran por el service worker (aguantan mejor en Android).
   · Si el navegador soporta TimestampTrigger, se programan de verdad
     y suenan aunque la app esté cerrada.
   · Si no, se revisan mientras la app vive + "puesta al día" al abrirla.
============================================================ */
let swReg=null;
const HAS_TRIGGER=('Notification' in window)&&('showTrigger' in Notification.prototype);
function notifOK(){ return ('Notification' in window)&&Notification.permission==='granted'&&S.settings.notif; }
function notify(title,body,tag,when){
  const opt={body,icon:'icon-192.png',badge:'icon-192.png',tag:tag||'texma',
    renotify:true,vibrate:[90,50,90],requireInteraction:false,data:{t:Date.now()}};
  try{
    if(when&&HAS_TRIGGER&&swReg){
      swReg.showNotification(title,{...opt,showTrigger:new TimestampTrigger(when)});
      return true;
    }
    if(swReg&&swReg.showNotification) swReg.showNotification(title,opt);
    else new Notification(title,opt);
  }catch(e){
    try{ new Notification(title,{body,icon:'icon-192.png'}); }catch(e2){ return false; }
  }
  return true;
}
/* todo lo que tiene que avisar un día dado */
function dueList(ds){
  const NM=S.settings.nMods||{}, out=[], dow=pDate(ds).getDay();
  if(NM.meds!==false) S.meds.forEach(m=>{
    if(m.days&&m.days.length&&!m.days.includes(dow)) return;
    (m.times||[]).forEach(t=>out.push({key:`m|${ds}|${m.id}|${t}`,time:t,
      title:'TEXMA · medicamento',body:`${m.name}${m.dose?' · '+m.dose:''} — ${t}`}));
  });
  if(NM.events!==false) S.events.forEach(e=>{
    if(e.date!==ds||!e.time) return;
    out.push({key:`e|${ds}|${e.id}`,time:e.time,
      title:'TEXMA · agenda',body:`${e.title}${e.place?' · '+e.place:''} — ${e.time}`});
  });
  if(NM.pagos!==false){
    const d2=pDate(ds); d2.setDate(d2.getDate()+2); const en2=iso(d2);
    S.recurring.forEach(r=>{
      if(r.nextDue===ds) out.push({key:`r0|${ds}|${r.id}`,time:'09:00',
        title:'TEXMA · pago',body:`Hoy vence ${r.name} · ${fMoney(r.amount)}`});
      if(r.nextDue===en2) out.push({key:`r2|${ds}|${r.id}`,time:'09:00',
        title:'TEXMA · pago',body:`${r.name} vence en 2 días · ${fMoney(r.amount)}`});
    });
  }
  if(NM.grat&&!S.gratitude.some(x=>x.date===ds))
    out.push({key:`g|${ds}`,time:NM.gratTime||'20:00',
      title:'TEXMA · agradecimiento',body:'¿Qué agradecés hoy? Escribilo en un ratito ♥'});
  if(NM.entreno&&!trainedOn(ds))
    out.push({key:`t|${ds}`,time:NM.entrenoTime||'19:00',
      title:'TEXMA · entrenamiento',body:'No cortes la racha 🔥 anotá lo de hoy'});
  if(NM.ciclo&&S.settings.cycleOn){
    const st=cycleStats();
    if(st.next){
      const av=pDate(st.next); av.setDate(av.getDate()-2);
      if(iso(av)===ds) out.push({key:`c|${ds}`,time:'10:00',
        title:'TEXMA · ciclo',body:`Tu período estaría por llegar el ${fShort(st.next)}`});
    }
  }
  return out.sort((a,b)=>a.time.localeCompare(b.time));
}
function firedMap(today){
  if(!S.fired||S.fired.d!==today) S.fired={d:today,k:{}};
  return S.fired.k;
}
function checkNotifs(){
  if(!notifOK()) return;
  const now=new Date(), today=hoyISO();
  const hm=`${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
  const fk=firedMap(today);
  let dirty=false;
  dueList(today).forEach(n=>{
    if(n.time>hm||fk[n.key]) return;
    fk[n.key]=1; dirty=true;
    /* puesta al día: si pasaron más de 3 horas ya no molesta, solo lo marca */
    const [H,M]=n.time.split(':').map(Number);
    const mins=(now.getHours()*60+now.getMinutes())-(H*60+M);
    if(mins<=180) notify(n.title,(mins>2?`(era ${n.time}) `:'')+n.body,n.key);
  });
  if(dirty) save();
}
/* alarmas reales programadas (solo donde el navegador lo soporta) */
async function scheduleTriggers(){
  if(!HAS_TRIGGER||!swReg||!notifOK()) return;
  try{
    const olds=await swReg.getNotifications({includeTriggered:false});
    olds.forEach(n=>{ if(n.tag&&/^[mertgc]\|/.test(n.tag)) n.close(); });
  }catch(e){}
  const now=Date.now();
  for(let i=0;i<3;i++){ /* hoy y los dos días siguientes */
    const d=new Date(); d.setDate(d.getDate()+i); const ds=iso(d);
    dueList(ds).forEach(n=>{
      const [H,M]=n.time.split(':').map(Number);
      const when=new Date(d); when.setHours(H,M,0,0);
      if(when.getTime()>now+2000) notify(n.title,n.body,n.key,when.getTime());
    });
  }
}
let notifT=null;
function startNotifLoop(){
  clearInterval(notifT);
  notifT=setInterval(checkNotifs,15000);
  checkNotifs(); scheduleTriggers();
}
document.addEventListener('visibilitychange',()=>{ if(!document.hidden){ checkNotifs(); scheduleTriggers(); } });
window.addEventListener('focus',checkNotifs);

/* ============================================================
   LICENCIA
   ------------------------------------------------------------
   Cómo funciona:
   1. Cada venta genera un CÓDIGO único en el servidor (Worker).
   2. La primera vez que se abre la app, el código se canjea online:
      el servidor lo marca como usado y devuelve una licencia FIRMADA
      con nuestra clave privada, atada al ID de ESE dispositivo.
   3. A partir de ahí la app valida la firma offline con la clave
      pública de abajo. Copiar el HTML a otro celu no sirve: el ID
      no coincide y el código ya está quemado.
   Para activarlo: poné LIC_ON=true, pegá la clave pública (server/keygen.mjs)
   y la URL del Worker.
============================================================ */
const LIC_ON=false;                       /* ← poné true cuando el Worker esté publicado */
const LIC_API='https://texma-lic.TU-CUENTA.workers.dev';
const LIC_PUB={kty:'EC',crv:'P-256',x:'PEGAR_X',y:'PEGAR_Y'};   /* clave PÚBLICA — sale de keygen.mjs */
const DEVK='texma_dev', LICK='texma_lic';

function deviceId(){
  let d=localStorage.getItem(DEVK);
  if(!d){
    const a=new Uint8Array(16); crypto.getRandomValues(a);
    d=[...a].map(x=>x.toString(16).padStart(2,'0')).join('');
    localStorage.setItem(DEVK,d);
  }
  return d;
}
const b64uDec=s=>Uint8Array.from(atob(s.replace(/-/g,'+').replace(/_/g,'/')+'==='.slice((s.length+3)%4)),c=>c.charCodeAt(0));
async function licVerify(token){
  try{
    const [p,sig]=String(token).split('.');
    if(!p||!sig) return null;
    const key=await crypto.subtle.importKey('jwk',LIC_PUB,{name:'ECDSA',namedCurve:'P-256'},false,['verify']);
    const ok=await crypto.subtle.verify({name:'ECDSA',hash:'SHA-256'},key,b64uDec(sig),
      new TextEncoder().encode(p));
    if(!ok) return null;
    const data=JSON.parse(new TextDecoder().decode(b64uDec(p)));
    if(data.device!==deviceId()) return null;
    if(data.exp&&Date.now()>data.exp) return null;
    return data;
  }catch(e){ return null; }
}
async function licActivate(code){
  const r=await fetch(LIC_API+'/activate',{method:'POST',headers:{'content-type':'application/json'},
    body:JSON.stringify({code:String(code).trim().toUpperCase(),device:deviceId()})});
  const j=await r.json().catch(()=>({}));
  if(!r.ok||!j.token) throw new Error(j.error||'No pude activar');
  localStorage.setItem(LICK,j.token);
  return j.token;
}
function licScreen(msg){
  const w=document.createElement('div'); w.id='lic';
  w.innerHTML=`
    <div class="lgo"><em>T</em>EXMA</div>
    <div class="lt">Activá tu TEXMA</div>
    <div class="ls">Pegá el código que te llegó con tu compra. Se usa una sola vez y queda atado a este celular.</div>
    <input id="licIn" placeholder="XXXX-XXXX-XXXX" maxlength="19" autocomplete="off">
    <div class="lerr" id="licEr">${esc(msg||'')}</div>
    <button class="btn primary" id="licGo">Activar</button>
    <div class="ls" style="font-size:11px;opacity:.7">¿Cambiaste de celular? Escribinos con tu código y te lo reactivamos.</div>`;
  document.body.appendChild(w);
  const inp=w.querySelector('#licIn'), er=w.querySelector('#licEr'), bt=w.querySelector('#licGo');
  const url=new URL(location.href), pre=url.searchParams.get('k');
  if(pre) inp.value=pre.toUpperCase();
  bt.addEventListener('click',async ()=>{
    const code=inp.value.trim();
    if(code.length<6){ er.textContent='Código incompleto'; return; }
    bt.disabled=true; bt.textContent='Activando…'; er.textContent='';
    try{
      const t=await licActivate(code);
      if(!await licVerify(t)) throw new Error('Licencia inválida');
      w.remove(); toast('¡Activada! Bienvenida ♥');
      if(!S.settings.onboarded) showOnb();
    }catch(e){
      er.textContent=e.message||'No pude activar';
      bt.disabled=false; bt.textContent='Activar';
    }
  });
  return w;
}
async function licGate(){
  if(!LIC_ON) return true;
  const t=localStorage.getItem(LICK);
  if(t&&await licVerify(t)) return true;
  const url=new URL(location.href), pre=url.searchParams.get('k');
  if(pre){
    try{
      const nt=await licActivate(pre);
      if(await licVerify(nt)){ history.replaceState({},'',url.pathname); return true; }
    }catch(e){ licScreen(e.message); return false; }
  }
  licScreen(t?'Esta licencia no es de este celular':'');
  return false;
}

if('serviceWorker' in navigator && location.protocol.startsWith('http')){
  /* si se publica una versión nueva, recargar sola una vez
     (solo si ya había un service worker: en la primera visita no hace falta) */
  const habiaSW=!!navigator.serviceWorker.controller;
  let recargando=false;
  navigator.serviceWorker.addEventListener('controllerchange',()=>{
    if(!habiaSW||recargando) return; recargando=true; location.reload();
  });
  navigator.serviceWorker.register('sw.js')
    .then(r=>{ swReg=r; r.update().catch(()=>{}); return navigator.serviceWorker.ready; })
    .then(r=>{ swReg=r||swReg; startNotifLoop(); })
    .catch(()=>startNotifLoop());
} else startNotifLoop();
